version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    # Keep SDK-aligned packages on .NET 11. Update these ceilings alongside
    # global.json, target frameworks, and CI workloads when moving to .NET 12.
    # Independently versioned packages (Test SDK, Azure SDK, etc.) are not capped.
    ignore:
      - dependency-name: "Microsoft.Maui.*"
        versions: ["[12.0.0,)"]
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: ["[12.0.0,)"]
      - dependency-name: "Microsoft.Extensions.*"
        versions: ["[12.0.0,)"]
      - dependency-name: "System.Configuration.ConfigurationManager"
        versions: ["[12.0.0,)"]
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"
    open-pull-requests-limit: 10

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 10

name: Publish WinGet Manifest

# Publishes a validated WinGet manifest branch to Redth/winget-pkgs and provides
# a link for opening the pull request against microsoft/winget-pkgs. Called
# automatically by the Build & Release workflow after a stable release is
# created, or run manually for an existing release.
#
# A repository-scoped deploy key avoids the short-lived SAML authorization
# required by Microsoft for personal access tokens. Opening the upstream pull
# request remains a deliberate one-click browser action.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to submit'
        required: true
        type: string
    secrets:
      WINGET_FORK_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit (for example, v0.8.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: Publish winget-pkgs branch
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:\.\d+)?)$') {
            throw "Release tags must use v[major].[minor].[patch] with an optional [.revision] component, for example v1.2.3 or v1.2.3.4. Got $tag."
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "PACKAGE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV

      - name: Download release ZIP packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo Redth/MAUI.Sherpa `
            --pattern "MAUI-Sherpa.win-x64.zip" `
            --pattern "MAUI-Sherpa.win-arm64.zip" `
            --dir packages

          if (-not (Test-Path "packages/MAUI-Sherpa.win-x64.zip")) {
            throw "Missing win-x64 asset for release $env:RELEASE_TAG."
          }
          if (-not (Test-Path "packages/MAUI-Sherpa.win-arm64.zip")) {
            throw "Missing win-arm64 asset for release $env:RELEASE_TAG."
          }
          Get-ChildItem packages | Format-Table Name, Length

      - name: Generate winget manifest
        shell: pwsh
        run: |
          $manifestDir = "manifests"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null

          $replacements = @{
            "__VERSION__" = $env:PACKAGE_VERSION
            "__RELEASE_TAG__" = $env:RELEASE_TAG
            "__X64_SHA256__" = (Get-FileHash "packages/MAUI-Sherpa.win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            "__ARM64_SHA256__" = (Get-FileHash "packages/MAUI-Sherpa.win-arm64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $templates = @{
            "winget/Maui.Sherpa.version.template.yaml" = "Maui.Sherpa.yaml"
            "winget/Maui.Sherpa.installer.template.yaml" = "Maui.Sherpa.installer.yaml"
            "winget/Maui.Sherpa.locale.en-US.template.yaml" = "Maui.Sherpa.locale.en-US.yaml"
          }

          foreach ($template in $templates.GetEnumerator()) {
            $content = Get-Content $template.Key -Raw
            foreach ($replacement in $replacements.GetEnumerator()) {
              $content = $content.Replace($replacement.Key, $replacement.Value)
            }
            $outputPath = Join-Path $manifestDir $template.Value
            Set-Content -Path $outputPath -Value $content -Encoding UTF8NoBOM
            Write-Host "Generated $outputPath"
            Write-Host $content
          }

          $validateOutput = winget validate --manifest $manifestDir 2>&1 | Out-String
          $validateExitCode = $LASTEXITCODE
          Write-Host $validateOutput
          $validationWarningExitCode = -1978335192 # 0x8A150028
          $warningOnly = $validateExitCode -eq $validationWarningExitCode -and
            $validateOutput -match "Manifest validation succeeded with warnings\."
          if ($validateExitCode -ne 0 -and -not $warningOnly) {
            throw "winget validate failed with exit code ${validateExitCode}. See output above."
          }
          if ($warningOnly) {
            Write-Warning "winget validate completed with non-blocking manifest warnings."
            $global:LASTEXITCODE = 0
          }

      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ inputs.tag }}
          path: manifests
          if-no-files-found: error

      - name: Publish manifest branch
        id: publish
        shell: pwsh
        env:
          WINGET_FORK_DEPLOY_KEY: ${{ secrets.WINGET_FORK_DEPLOY_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_FORK_DEPLOY_KEY)) {
            throw "WINGET_FORK_DEPLOY_KEY is not configured."
          }

          $branch = "maui-sherpa-$env:PACKAGE_VERSION"
          $checkoutPath = Join-Path $env:RUNNER_TEMP "winget-pkgs"
          $keyPath = Join-Path $env:RUNNER_TEMP "winget-fork-deploy-key"
          $manifestPath = "manifests/m/MAUI/Sherpa/$env:PACKAGE_VERSION"

          $privateKey = $env:WINGET_FORK_DEPLOY_KEY.Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText($keyPath, $privateKey, [System.Text.UTF8Encoding]::new($false))
          $env:GIT_SSH_COMMAND = "ssh -i `"$keyPath`" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          try {
            git clone --filter=blob:none --no-checkout --depth 1 https://github.com/microsoft/winget-pkgs.git $checkoutPath
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to clone microsoft/winget-pkgs."
            }

            Push-Location $checkoutPath
            try {
              git sparse-checkout init --cone
              git sparse-checkout set $manifestPath
              git checkout master
              git checkout -B $branch

              New-Item -ItemType Directory -Force -Path $manifestPath | Out-Null
              Copy-Item (Join-Path $env:GITHUB_WORKSPACE "manifests/*") -Destination $manifestPath -Force

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- $manifestPath
              git commit -m "New version: MAUI Sherpa $env:PACKAGE_VERSION"
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to commit the generated WinGet manifests."
              }

              git remote add publisher git@github.com:Redth/winget-pkgs.git
              git push --force publisher "HEAD:refs/heads/$branch"
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to publish $branch to Redth/winget-pkgs."
              }
            }
            finally {
              Pop-Location
            }
          }
          finally {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }

          $compareUrl = "https://github.com/microsoft/winget-pkgs/compare/master...Redth:winget-pkgs:${branch}?expand=1"
          "compare_url=$compareUrl" >> $env:GITHUB_OUTPUT
          Write-Host "::notice title=WinGet pull request ready::$compareUrl"

          @"
          ## WinGet pull request ready

          The validated manifests were published to ``Redth/winget-pkgs:$branch``.

          **[Open the pull request against microsoft/winget-pkgs]($compareUrl)**
          "@ >> $env:GITHUB_STEP_SUMMARY
